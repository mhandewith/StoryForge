services:
  backend:
    image: ghcr.io/mhandewith/storyforge:latest
    container_name: storyforge
    restart: unless-stopped
    ports:
      - "${STORYFORGE_PORT:-8088}:8080"
    environment:
      PORT: "8080"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: storyforge
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      PGDATABASE: storyforge
      PGSSLMODE: disable
      STORYFORGE_PUBLIC_ORIGIN: "${STORYFORGE_PUBLIC_ORIGIN:-}"
      CF_ACCESS_TEAM_DOMAIN: "${CF_ACCESS_TEAM_DOMAIN:-}"
      CF_ACCESS_AUD: "${CF_ACCESS_AUD:-}"
      STORYFORGE_ADMIN_EMAILS: "${STORYFORGE_ADMIN_EMAILS:-}"
      STORYFORGE_RECORDINGS_DIR: /data/recordings
    volumes:
      - recordings:/data/recordings
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: storyforge
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: storyforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyforge -d storyforge"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
  recordings:
