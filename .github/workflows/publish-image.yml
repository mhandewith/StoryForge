name: Publish Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Check Go code
        working-directory: backend
        run: |
          test -z "$(gofmt -l cmd internal migrations)"
          go test -race ./...
          go vet ./...

      - name: Set image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and test
        run: docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t "$IMAGE:$GITHUB_SHA" .

      - name: Test PostgreSQL API
        env:
          SMOKE_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: python3 scripts/container-smoke.py setup

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test admin in desktop and mobile browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Verify persistence and database recovery
        env:
          SMOKE_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: python3 scripts/container-smoke.py restart

      - name: Save browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-results
          path: frontend/test-results/

      - name: Clean up test environment
        if: always()
        run: python3 scripts/container-smoke.py cleanup

      - name: Publish to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
