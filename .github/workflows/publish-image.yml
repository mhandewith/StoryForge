name: Publish Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Check Go code
        working-directory: backend
        run: |
          test -z "$(gofmt -l cmd)"
          go test -race ./...
          go vet ./...

      - name: Set image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and test
        run: docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t "$IMAGE:$GITHUB_SHA" .

      - name: Check running container
        shell: bash
        run: |
          docker run -d --name storyforge-test -p 127.0.0.1:8088:8080 "$IMAGE:$GITHUB_SHA"
          trap 'docker logs storyforge-test; docker rm -f storyforge-test' EXIT
          for attempt in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' storyforge-test)
            if [ "$status" = healthy ]; then
              curl --fail --silent http://127.0.0.1:8088/healthz | jq -e '.status == "ok" and .service == "StoryForge"'
              exit 0
            fi
            sleep 2
          done
          echo "Container failed its health check"
          exit 1

      - name: Publish to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
